# Type-check and build every push and pull request, so a broken content file
# is caught before Cloudflare tries to deploy it.
name: check

on:
  push:
    branches: [develop, main, 'feature/**', 'hotfix/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
