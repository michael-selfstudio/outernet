# Tag every release: when main moves and package.json carries a version that has
# no tag yet, tag it (bare semver, GitFlow per CLAUDE.md). Lets a release happen
# from the GitHub web UI alone — merging develop into main is the whole step.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the version if it is new
        run: |
          version=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version is already tagged; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "$version"
          git push origin "$version"
